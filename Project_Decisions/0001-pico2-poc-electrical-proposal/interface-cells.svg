<text x="1090" y="256" fill="#182737" font-family="Consolas,monospace" font-size="18">150R is a legacy example.</text>
<text x="75" y="393" fill="#182737" font-family="Consolas,monospace" font-size="18">GPIO low / high-Z = release. Pull-down keeps Q off during reset.</text>
<text x="75" y="423" fill="#182737" font-family="Consolas,monospace" font-size="18">WRITE GATE only: add removable WRITE ARM link before the 100R gate resistor.</text>
