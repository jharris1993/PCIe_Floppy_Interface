<text x="75" y="1248" fill="#182737" font-family="Consolas,monospace" font-size="18">One shunt: TX or RX. No shunt: GPIO disconnected; Q stays off.</text>
<text x="75" y="1278" fill="#182737" font-family="Consolas,monospace" font-size="18">This selects direction between configurations. For live open-drain bidirectionality,</text>
<text x="75" y="1308" fill="#182737" font-family="Consolas,monospace" font-size="18">use separate TX and RX GPIOs instead; never tie the receiver output to the Q gate.</text>
