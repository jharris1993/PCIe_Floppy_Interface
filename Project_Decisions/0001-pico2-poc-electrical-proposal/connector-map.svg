<text x="65" y="1000" fill="#182737" font-family="Consolas,monospace" font-size="18">All conventional odd contacts: GND. Approve each actual drive pinout before connection.</text>
<text x="65" y="1030" fill="#182737" font-family="Consolas,monospace" font-size="18">9 TX + 4 RX + 4 FLEX = 17 GPIOs. Full fit: 13 MOSFETs + 2 hex receiver ICs.</text>
<polyline points="45,1055 1555,1055" fill="none" stroke="#516477" stroke-width="2"/>
<text x="45" y="1096" fill="#235e91" font-family="Consolas,monospace" font-size="24">E. POWER / DEFAULTS</text>
<text x="65" y="1139" fill="#182737" font-family="Consolas,monospace" font-size="19">USB -&gt; Pico 2          Pico 3V3(OUT) -&gt; receiver VCC (pin 14); GND -&gt; pin 7</text>
<text x="65" y="1173" fill="#182737" font-family="Consolas,monospace" font-size="19">Drive regulated 5 V -&gt; +5V_IF pull-ups; drive motor power uses its own connector.</text>
<text x="65" y="1207" fill="#182737" font-family="Consolas,monospace" font-size="19">Do not connect external +5V_IF to Pico VBUS or 3V3. Connect all signal grounds.</text>
<text x="65" y="1241" fill="#182737" font-family="Consolas,monospace" font-size="19">Per IC: 100 nF bypass. Per local rail: 4.7 uF bulk. Ground unused receiver inputs.</text>
<text x="65" y="1275" fill="#182737" font-family="Consolas,monospace" font-size="19">TX GPIOs start LOW. WRITE ARM starts OPEN. FLEX jumpers must match firmware.</text>
<text x="65" y="1309" fill="#182737" font-family="Consolas,monospace" font-size="19">TX pull-ups: normally at drive. RX pull-ups: removable 1k starting value; see notes.</text>
<text x="65" y="1352" fill="#516477" font-family="Consolas,monospace" font-size="18">Unverified: final GPIO map, approved drives, cable loading, pulse widths, power sequencing.</text>
<text x="45" y="1424" fill="#516477" font-family="Consolas,monospace" font-size="18">TENTATIVE | 2026-09-01 | GPIO numbers TBD | See README for limits and sources</text>
</svg>